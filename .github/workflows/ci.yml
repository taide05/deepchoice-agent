name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run credential-free offline smoke evaluation
        run: python -m benchmarks.run_offline_eval --check-baseline

      - name: Static checks (pyflakes + vulture)
        run: |
          pip install pyflakes vulture
          pyflakes src/ tests/
          # Pydantic/FastAPI rely heavily on reflection; only gate definite findings.
          vulture src/ --min-confidence 100
