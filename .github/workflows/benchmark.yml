name: Offline evaluation (smoke-v1)

# Live durable benchmarking is configured with the frozen O1 dataset/protocol.
# This manual workflow does not use provider secrets or run paid judges.
on:
  workflow_dispatch:

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify frozen offline baseline
        run: python -m benchmarks.run_offline_eval --check-baseline --output outputs/offline-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-smoke-v1
          path: outputs/offline-smoke.json
