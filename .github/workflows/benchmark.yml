name: Benchmark

# 手动触发、会产生真实外部调用与费用的历史批量入口。
# 不设固定指标下限；当前版本的内容质量以真实报告评审为准（见 HANDOFF.md）。

on:
  workflow_dispatch:
    inputs:
      cases_file:
        description: "Cases file (relative to benchmarks/)"
        required: true
        default: "cases_verify_30.json"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run benchmark
        run: python -m benchmarks.run_baseline --cases-file "benchmarks/${{ inputs.cases_file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/runs/
