services:
  server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DS_FLASH_API_KEY=${DS_FLASH_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QW_FLASH_API_KEY=${QW_FLASH_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - STACKEXCHANGE_API_KEY=${STACKEXCHANGE_API_KEY}
      - LOCAL_PROXY=${LOCAL_PROXY}
      - FWD_BASE=${FWD_BASE}
      - FWD_KEY=${FWD_KEY}
      - FWD_TARGETS=${FWD_TARGETS:-export.arxiv.org,api.github.com,api.stackexchange.com}
      - OUTBOUND_CHANNELS=${OUTBOUND_CHANNELS:-local-proxy,self-forward,direct,direct-v6}
      - OUTBOUND_CHANNELS_COMMUNITY=${OUTBOUND_CHANNELS_COMMUNITY:-self-forward,local-proxy,direct}
      - RETRIEVAL_CACHE_ENABLED=${RETRIEVAL_CACHE_ENABLED:-1}
      # SQLite runtime coordination is intentionally single-instance/single-worker.
      - WEB_CONCURRENCY=1
    volumes:
      # 运行时数据持久化——镜像里没有，容器重建不能丢
      - outputs:/app/outputs
      - chroma_db:/app/chroma_kb/chroma_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://server:8000
    depends_on:
      - server

volumes:
  outputs:
  chroma_db:
