services:
  server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DS_FLASH_API_KEY=${DS_FLASH_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - FLASH_API_KEY=${FLASH_API_KEY:-}
      - DS_FLASH_MODEL=${DS_FLASH_MODEL:-${FLASH_MODEL:-deepseek-v4-flash}}
      - DS_FLASH_BASE_URL=${DS_FLASH_BASE_URL:-${FLASH_BASE_URL:-${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}}}
      - LLM_DS_CONCURRENCY=${LLM_DS_CONCURRENCY:-80}
      - DEEPCHOICE_SYNTH_THINKING=${DEEPCHOICE_SYNTH_THINKING:-0}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - STACKEXCHANGE_API_KEY=${STACKEXCHANGE_API_KEY}
      - LOCAL_PROXY=${LOCAL_PROXY}
      - SAFE_FETCH_TRUSTED_LOCAL_PROXY=${SAFE_FETCH_TRUSTED_LOCAL_PROXY:-}
      - FWD_BASE=${FWD_BASE}
      - FWD_KEY=${FWD_KEY}
      - FWD_TARGETS=${FWD_TARGETS:-export.arxiv.org,api.github.com,api.stackexchange.com}
      - OUTBOUND_CHANNELS=${OUTBOUND_CHANNELS:-local-proxy,self-forward,direct,direct-v6}
      - OUTBOUND_CHANNELS_COMMUNITY=${OUTBOUND_CHANNELS_COMMUNITY:-self-forward,local-proxy,direct}
      - OUTBOUND_CHANNELS_TAVILY=${OUTBOUND_CHANNELS_TAVILY:-local-proxy,direct,direct-v6}
      - RETRIEVAL_CACHE_ENABLED=${RETRIEVAL_CACHE_ENABLED:-1}
      - CHROMA_PATH=${CHROMA_PATH:-/app/chroma_kb/chroma_db}
      - LEARNED_DOCS_PATH=${LEARNED_DOCS_PATH:-/app/learned_docs.json}
      - LEARNED_DOCS_READONLY=${LEARNED_DOCS_READONLY:-0}
      - TAVILY_KEY_STATE_PATH=${TAVILY_KEY_STATE_PATH:-/app/outputs/tavily_key_state.json}
      # SQLite runtime coordination is intentionally single-instance/single-worker.
      - WEB_CONCURRENCY=1
    volumes:
      # 运行时数据持久化——镜像里没有，容器重建不能丢
      - outputs:/app/outputs
      - chroma_db:/app/chroma_kb/chroma_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://server:8000
    depends_on:
      - server

volumes:
  outputs:
  chroma_db:
